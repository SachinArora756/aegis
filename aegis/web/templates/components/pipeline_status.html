<div class="flex items-center gap-3 px-4 py-3 bg-gray-900/50 border rounded-lg transition-all
    {% if status == 'running' %}border-blue-500/30 bg-blue-500/5
    {% elif status == 'success' %}border-green-500/30 bg-green-500/5
    {% elif status == 'error' %}border-red-500/30 bg-red-500/5
    {% else %}border-gray-700/30{% endif %}">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0
        {% if status == 'running' %}bg-blue-500/10
        {% elif status == 'success' %}bg-green-500/10
        {% elif status == 'error' %}bg-red-500/10
        {% else %}bg-gray-700/20{% endif %}">
        {% if status == 'running' %}
        <span class="text-blue-400 text-sm animate-spin">&#8634;</span>
        {% elif status == 'success' %}
        <span class="text-green-400 text-sm">&#10003;</span>
        {% elif status == 'error' %}
        <span class="text-red-400 text-sm">&#10007;</span>
        {% else %}
        <span class="text-gray-500 text-sm">&#9679;</span>
        {% endif %}
    </div>
    <div>
        <p class="text-sm font-medium
            {% if status == 'running' %}text-blue-300
            {% elif status == 'success' %}text-green-300
            {% elif status == 'error' %}text-red-300
            {% else %}text-gray-400{% endif %}">
            {{ stage_name }}
        </p>
        <p class="text-[10px]
            {% if status == 'running' %}text-blue-400/70
            {% elif status == 'success' %}text-green-400/70
            {% elif status == 'error' %}text-red-400/70
            {% else %}text-gray-500{% endif %}">
            {{ status_text or status | title }}
        </p>
    </div>
</div>
