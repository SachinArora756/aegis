<div class="flex items-start gap-3 p-3 bg-gray-800 rounded-lg border-l-4
    {% if classification == 'supply_chain_vuln' %}border-red-500
    {% elif classification == 'threat_intel' %}border-orange-500
    {% else %}border-gray-600{% endif %}">
    <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
            <span class="px-1.5 py-0.5 rounded text-[10px] font-medium uppercase tracking-wider
                {% if classification == 'supply_chain_vuln' %}bg-red-500/10 text-red-400
                {% elif classification == 'threat_intel' %}bg-orange-500/10 text-orange-400
                {% else %}bg-gray-600/20 text-gray-400{% endif %}">
                {{ classification | replace('_', ' ') }}
            </span>
            <span class="text-xs text-gray-500">{{ time_ago }}</span>
        </div>
        <h4 class="text-sm font-medium mt-1 text-gray-200 truncate">{{ title }}</h4>
        <p class="text-xs text-gray-400 mt-1">{{ source }} &bull; Impact: {{ impact_score }}/10</p>
    </div>
</div>
