[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Supply-chain risk tracker — SBOM/SCA pipeline + news ingestion agent + match engine"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "slack-sdk>=3.33.0",
    "boto3>=1.35.0",
    "click>=8.1.7",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "rapidfuzz>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
