<span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider
    {% if severity == 'Critical' %}bg-red-500/20 text-red-400
    {% elif severity == 'High' %}bg-orange-500/20 text-orange-400
    {% elif severity == 'Medium' %}bg-yellow-500/20 text-yellow-400
    {% elif severity == 'Low' %}bg-blue-500/20 text-blue-400
    {% else %}bg-gray-600/20 text-gray-400{% endif %}">
    {{ severity }}
</span>
